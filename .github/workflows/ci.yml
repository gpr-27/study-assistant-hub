name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches .python-version / the Vercel runtime
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build static frontend (what Vercel runs)
        run: python scripts/build_frontend.py --out dist

      - name: Import the serverless entrypoint
        run: python -c "import api.index"

      - name: Run tests
        # The suite is hermetic — env is seeded in tests/__init__.py (no secrets,
        # no network, no real model, the LLM is mocked).
        run: python -m pytest -q
